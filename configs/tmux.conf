
# Plugins
set -g @plugin 'tmux-plugins/tpm'               # tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect'    # tmux resurrect to restore tmux environment after system start
set -g @plugin 'tmux-plugins/tmux-continuum'    # tmux continuum to automatically save tmux environment every 15 minutes and restore it on tmux start
set -g @plugin 'anghootys/tmux-ip-address'      # tmux plugin to show the current machine's IP address in the status bar
set -g @plugin 'rickstaa/tmux-notify'           # tmux plugin to send desktop notifications from tmux
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @resurrect-processes 'nvim claude'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-claude-save.sh'

# Activate tmux resurrect and continuum plugins
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'

# just like screen:
set-option -g prefix C-a

# get to the last active window
bind-key C-a last-window

# start at left, top row...
set -g base-index 1

setw -g aggressive-resize on

# bell me
set -g bell-action any

# Set a Ctrl-b shortcut for reloading your tmux config
bind r source-file ~/.tmux.conf

set -g history-limit 40000

# Rename your terminals
set -g set-titles on

bind v copy-mode
setw -g mode-keys vi

# Use v and y for highlight and copy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Split pane and window in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Dismiss the red dot (Claude waiting / command finished) for current window
bind Escape run-shell "rm -f /tmp/claude-waiting/#{session_name}_#{window_index} /tmp/process-done/#{session_name}_#{window_index}; tmux refresh-client -S"

# Session navigation (refresh-client forces immediate status update)
bind -n M-j switch-client -p \; refresh-client
bind -n M-k switch-client -n \; refresh-client
bind -n M-h previous-window
bind -n M-l next-window

# Status bar customization
#set -g status-utf8 on
set -g status-bg black
set -g status-fg white
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set -g status-left "#[fg=Green]#(whoami)#[fg=white]::#[fg=blue] "
set -g status-justify left
set -g status-right '| IP: #{ip_address} | #(whoami)@#H | #[fg=Cyan]#S #[fg=white]%a %d %b %R'

set -g status-position bottom

# Session list embedded in catppuccin's status-left
# Must come AFTER tpm/plugins to override catppuccin's status-left
set -g status-left-length 200
set -g status-left '#(~/.config/tmux/scripts/session-bar.sh)'
set -g status-interval 2

# Window indicator: pill turns red with ⚡ when Claude is waiting
set -g window-status-format '#(~/.config/tmux/scripts/window-status.sh "#{session_name}" "#{window_index}" "#{window_name}" "#{pane_current_path}" 0)'
set -g window-status-current-format '#(~/.config/tmux/scripts/window-status.sh "#{session_name}" "#{window_index}" "#{window_name}" "#{pane_current_path}" 1)'

# Right side: CPU load | RAM | Battery
set -g status-right "#[bg=#f9e2af,fg=#1e1e2e] 󰍛 #(cut -d' ' -f1 /proc/loadavg) #[bg=#89b4fa,fg=#1e1e2e] 󰘚 #(free -h | awk '/^Mem:/{print \$3\"/\"\$2}') #[bg=#a6e3a1,fg=#1e1e2e] #(~/.config/tmux/scripts/battery.sh) "
set -g status-right-length 120

# fix ssh agent when tmux is detached
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
